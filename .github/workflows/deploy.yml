name: Deploy to Google Cloud Run

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Re-apply GitHub Actions secrets to Cloud Run without a code change (secrets are not synced from GitHub to GCP automatically).
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Optional Actions secret REGION; default matches docs/scripts (Artifact Registry + Cloud Run).
  REGION: ${{ secrets.REGION || 'asia-southeast1' }}
  SERVICE_NAME: news-site
  ARTIFACT_REPO: cloud-run-images

jobs:
  validate:
    name: Lint & build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:webmaster
      - name: Docker build (PR smoke test; no push)
        if: github.event_name == 'pull_request'
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_ADSENSE_CLIENT_ID: ""
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" \
            --build-arg NEXT_PUBLIC_ADSENSE_CLIENT_ID="$NEXT_PUBLIC_ADSENSE_CLIENT_ID" \
            -t app:test .

  build-and-deploy:
    name: Build & deploy Cloud Run
    runs-on: ubuntu-latest
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    outputs:
      service_url: ${{ steps.deploy-url.outputs.service_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Require GCP_SA_KEY secret
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "${GCP_SA_KEY}" ]; then
            echo "::error::Repository secret GCP_SA_KEY is missing or empty. Settings → Secrets and variables → Actions → New repository secret → name exactly GCP_SA_KEY → paste the full service account JSON (type, project_id, private_key, client_email, …)."
            exit 1
          fi

      - name: Require GCP_PROJECT_ID secret
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if [ -z "${GCP_PROJECT_ID}" ]; then
            echo "::error::Repository secret GCP_PROJECT_ID is missing or empty. Use the same Google Cloud project ID as in your GCP_SA_KEY JSON field project_id (e.g. rankpulse-491905)."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # Cloud Scheduler OIDC uses the same SA as this workflow key (no separate news-pipeline).
      - name: Resolve OIDC identity for Cloud Scheduler
        id: scheduler_oidc
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.GCP_SA_KEY }}' > .gha-sa-key.json
          KEY_PROJECT=$(jq -r .project_id .gha-sa-key.json)
          EMAIL=$(jq -r .client_email .gha-sa-key.json)
          rm -f .gha-sa-key.json
          if [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ] || [ "$KEY_PROJECT" = "null" ] || [ -z "$KEY_PROJECT" ]; then
            echo "::error::GCP_SA_KEY must be valid service account JSON with project_id and client_email."
            exit 1
          fi
          if [ "${GCP_PROJECT_ID}" != "${KEY_PROJECT}" ]; then
            echo "::error::GCP_PROJECT_ID secret (${GCP_PROJECT_ID}) does not match project_id inside GCP_SA_KEY (${KEY_PROJECT}). Fix one so they are identical."
            exit 1
          fi
          echo "email=${EMAIL}" >> "$GITHUB_OUTPUT"
          printf '%s' "$EMAIL" > .scheduler-oidc-email
          echo "Scheduler OIDC / Run invoker identity: ${EMAIL} (project ${KEY_PROJECT})"

      # Do not call `gcloud services enable` here: it needs Service Usage / Resource Manager
      # permissions most deploy keys do not have. Enable APIs once as a project Owner (Console
      # or `scripts/setup-gcp.sh` with `gcloud auth login`), then CI only uses the deploy SA.
      - name: Configure project and Artifact Registry repo
        run: |
          set -euo pipefail
          gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"
          REPO="${{ env.ARTIFACT_REPO }}"
          LOC="${{ env.REGION }}"
          if gcloud artifacts repositories describe "$REPO" --location="$LOC" &>/dev/null; then
            echo "Artifact Registry repo OK: $LOC/$REPO"
            exit 0
          fi
          echo "Creating Artifact Registry repo $REPO in $LOC ..."
          if gcloud artifacts repositories create "$REPO" \
            --repository-format=docker \
            --location="$LOC" \
            --description="Docker images for Cloud Run" \
            --quiet; then
            exit 0
          fi
          echo "::error::Could not use or create Artifact Registry. As project Owner: (1) Enable Cloud Resource Manager + Service Usage + Artifact Registry + Cloud Run + Cloud Scheduler + IAM APIs. (2) Create repo: gcloud artifacts repositories create $REPO --repository-format=docker --location=$LOC. Or run ./scripts/setup-gcp.sh locally after gcloud auth login. Grant this SA at least roles/artifactregistry.writer + roles/run.admin + roles/iam.serviceAccountUser on the deploy/runtime accounts you use."
          exit 1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}"
          docker build \
            --build-arg NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL}" \
            --build-arg NEXT_PUBLIC_ADSENSE_CLIENT_ID="${NEXT_PUBLIC_ADSENSE_CLIENT_ID}" \
            --tag "${IMAGE}:${{ github.sha }}" \
            --tag "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Write runtime env file (from GitHub secrets)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          HUGGINGFACE_EMBEDDING_MODEL: ${{ secrets.HUGGINGFACE_EMBEDDING_MODEL }}
          HUGGINGFACE_TEXT_GENERATION_MODEL: ${{ secrets.HUGGINGFACE_TEXT_GENERATION_MODEL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          METALPRICE_API_KEY: ${{ secrets.METALPRICE_API_KEY }}
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
          HUMANIZER_API_KEY: ${{ secrets.HUMANIZER_API_KEY }}
          HUMANIZER_PROVIDER: ${{ secrets.HUMANIZER_PROVIDER }}
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          BING_OAUTH_CLIENT_ID: ${{ secrets.BING_OAUTH_CLIENT_ID }}
          BING_OAUTH_CLIENT_SECRET: ${{ secrets.BING_OAUTH_CLIENT_SECRET }}
          YANDEX_OAUTH_CLIENT_ID: ${{ secrets.YANDEX_OAUTH_CLIENT_ID }}
          YANDEX_OAUTH_CLIENT_SECRET: ${{ secrets.YANDEX_OAUTH_CLIENT_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          GOOGLE_SEARCH_CONSOLE_API_KEY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_API_KEY }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          YANDEX_WEBMASTER_TOKEN: ${{ secrets.YANDEX_WEBMASTER_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          WEBMASTER_OAUTH_STATE_SECRET: ${{ secrets.WEBMASTER_OAUTH_STATE_SECRET }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          INDEX_URL_BATCH_LIMIT: ${{ secrets.INDEX_URL_BATCH_LIMIT }}
          ENABLE_PLAYWRIGHT: ${{ secrets.ENABLE_PLAYWRIGHT }}
        run: |
          export CLOUD_SCHEDULER_OIDC_SA="$(cat .scheduler-oidc-email)"
          node scripts/write-cloud-run-env-yaml.cjs /tmp/cloud-run-env.yaml

      - name: Verify runtime env (MongoDB required for API / cron)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${MONGODB_URI:-}" ] && [ -z "${MONGODB_URL:-}" ]; then
            echo "::error::Set repository secret MONGODB_URI or MONGODB_URL (Actions → Secrets). Without it, Cloud Run cannot read/write the database and the site will show empty data."
            exit 1
          fi
          if ! grep -q '^MONGODB_URI:' /tmp/cloud-run-env.yaml; then
            echo "::error::Expected MONGODB_URI in /tmp/cloud-run-env.yaml after write-cloud-run-env-yaml (check secret values are non-empty)."
            exit 1
          fi
          echo "Runtime env file has $(grep -c '^[A-Z]' /tmp/cloud-run-env.yaml || true) variable line(s) (incl. NODE_ENV)."

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 2Gi \
            --cpu 2 \
            --timeout 900 \
            --concurrency 40 \
            --min-instances 0 \
            --max-instances 10 \
            --env-vars-file /tmp/cloud-run-env.yaml \
            --quiet

      - name: Capture service URL and set OIDC audience
        id: deploy-url
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" --region "${{ env.REGION }}" --format 'value(status.url)')
          echo "service_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"
          gcloud run services update "${{ env.SERVICE_NAME }}" \
            --region="${{ env.REGION }}" \
            --update-env-vars="CLOUD_RUN_AUDIENCE=${URL}" \
            --quiet

      - name: Grant deploy SA Service Account User on itself (Scheduler OIDC actAs)
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          SA="$(cat .scheduler-oidc-email)"
          if gcloud iam service-accounts add-iam-policy-binding "$SA" \
            --project="${GCP_PROJECT_ID}" \
            --member="serviceAccount:${SA}" \
            --role="roles/iam.serviceAccountUser" \
            --quiet; then
            echo "Granted roles/iam.serviceAccountUser on ${SA} for member ${SA}"
          else
            echo "::warning::Could not set IAM on the service account (need iam.serviceAccounts.setIamPolicy). Cloud Scheduler job creation may fail with actAs denied until an Owner runs:"
            echo "::warning::gcloud iam service-accounts add-iam-policy-binding ${SA} --project=${GCP_PROJECT_ID} --member=serviceAccount:${SA} --role=roles/iam.serviceAccountUser"
          fi

      - name: Grant Cloud Run invoker to scheduler OIDC identity
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          INVOKER_SA="$(cat .scheduler-oidc-email)"
          if gcloud run services add-iam-policy-binding "${{ env.SERVICE_NAME }}" \
            --region="${{ env.REGION }}" \
            --member="serviceAccount:${INVOKER_SA}" \
            --role="roles/run.invoker" \
            --quiet; then
            echo "Granted roles/run.invoker on ${{ env.SERVICE_NAME }} to ${INVOKER_SA}"
          else
            echo "::warning::Deploy SA lacks run.services.setIamPolicy on this service. Cloud Run is deployed; Scheduler OIDC may get HTTP 403 until a project Owner runs once (same identity as the deploy key client_email):"
            echo "::warning::gcloud run services add-iam-policy-binding ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --project=${GCP_PROJECT_ID} --member=serviceAccount:${INVOKER_SA} --role=roles/run.invoker"
            echo "::warning::Alternatively grant the deploy SA a role that includes setIamPolicy (e.g. roles/run.admin on the project)."
          fi
          rm -f .scheduler-oidc-email

  setup-scheduler:
    name: Cloud Scheduler jobs
    needs: build-and-deploy
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      SERVICE_URL: ${{ needs.build-and-deploy.outputs.service_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Require GCP_SA_KEY secret
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "${GCP_SA_KEY}" ]; then
            echo "::error::Repository secret GCP_SA_KEY is missing or empty."
            exit 1
          fi

      - name: Require GCP_PROJECT_ID secret
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if [ -z "${GCP_PROJECT_ID}" ]; then
            echo "::error::Repository secret GCP_PROJECT_ID is missing or empty."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2

      # Re-resolve client_email here: GitHub blanks job outputs that match secret substrings,
      # so passing scheduler OIDC SA from the previous job often yields an empty SERVICE_ACCOUNT_EMAIL.
      - name: Resolve OIDC identity for Cloud Scheduler
        id: scheduler_oidc
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.GCP_SA_KEY }}' > .gha-sa-key.json
          KEY_PROJECT=$(jq -r .project_id .gha-sa-key.json)
          EMAIL=$(jq -r .client_email .gha-sa-key.json)
          rm -f .gha-sa-key.json
          if [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ] || [ "$KEY_PROJECT" = "null" ] || [ -z "$KEY_PROJECT" ]; then
            echo "::error::GCP_SA_KEY must be valid service account JSON with project_id and client_email."
            exit 1
          fi
          if [ "${GCP_PROJECT_ID}" != "${KEY_PROJECT}" ]; then
            echo "::error::GCP_PROJECT_ID secret (${GCP_PROJECT_ID}) does not match project_id inside GCP_SA_KEY (${KEY_PROJECT})."
            exit 1
          fi
          echo "email=${EMAIL}" >> "$GITHUB_OUTPUT"
          printf '%s' "$EMAIL" > .scheduler-oidc-email
          echo "Scheduler OIDC identity: ${EMAIL} (project ${KEY_PROJECT})"

      - name: Grant deploy SA Service Account User on itself (Scheduler OIDC actAs)
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          SA="$(cat .scheduler-oidc-email)"
          if gcloud iam service-accounts add-iam-policy-binding "$SA" \
            --project="${GCP_PROJECT_ID}" \
            --member="serviceAccount:${SA}" \
            --role="roles/iam.serviceAccountUser" \
            --quiet; then
            echo "Granted roles/iam.serviceAccountUser on ${SA}"
          else
            echo "::warning::Could not grant actAs self-binding. Owner: gcloud iam service-accounts add-iam-policy-binding ${SA} --project=${GCP_PROJECT_ID} --member=serviceAccount:${SA} --role=roles/iam.serviceAccountUser"
          fi

      - name: Apply scheduler definitions
        run: |
          export SERVICE_ACCOUNT_EMAIL="$(cat .scheduler-oidc-email)"
          rm -f .scheduler-oidc-email
          chmod +x scripts/setup-cloud-scheduler.sh
          ./scripts/setup-cloud-scheduler.sh
      - name: List scheduler jobs
        run: |
          set -euo pipefail
          source scripts/lib/gcloud-list-formats.sh
          gcloud scheduler jobs list --location="${{ env.REGION }}" --format="${GCLOUD_SCHEDULER_JOBS_LIST_FORMAT}"

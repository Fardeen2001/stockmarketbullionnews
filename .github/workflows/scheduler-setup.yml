name: Setup Cloud Scheduler Jobs

on:
  workflow_dispatch:
    inputs:
      service_url:
        description: "Cloud Run HTTPS URL (must match --oidc-audience), e.g. https://news-site-xxxxx.asia-southeast1.run.app"
        required: true
        type: string

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-southeast1

jobs:
  setup-scheduler:
    name: Configure Cloud Scheduler
    runs-on: ubuntu-latest
    env:
      SA_EMAIL: news-pipeline@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify scheduler service account exists
        run: |
          set -euo pipefail
          gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"
          SA="${{ env.SA_EMAIL }}"
          if gcloud iam service-accounts describe "$SA" --quiet &>/dev/null; then
            echo "Scheduler SA OK: $SA"
            exit 0
          fi
          echo "::error::Missing service account $SA. Create it once as Owner: gcloud iam service-accounts create news-pipeline --project=\"${{ secrets.GCP_PROJECT_ID }}\" --display-name=\"Cloud Scheduler -> Cloud Run\". See docs/GCP_DEPLOYMENT.md."
          exit 1

      - name: Setup scheduler jobs
        env:
          SERVICE_URL: ${{ github.event.inputs.service_url }}
          SERVICE_ACCOUNT_EMAIL: ${{ env.SA_EMAIL }}
        run: |
          chmod +x scripts/setup-cloud-scheduler.sh
          ./scripts/setup-cloud-scheduler.sh

      - name: List scheduler jobs
        run: gcloud scheduler jobs list --location="${{ env.REGION }}" --format="table(name,schedule,state)"

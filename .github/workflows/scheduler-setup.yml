name: Setup Cloud Scheduler Jobs

on:
  workflow_dispatch:
    inputs:
      service_url:
        description: "Cloud Run HTTPS URL (OIDC token audience; must match CLOUD_RUN_AUDIENCE), e.g. https://news-site-xxxxx.asia-southeast1.run.app"
        required: true
        type: string

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.REGION || 'asia-southeast1' }}
  SERVICE_NAME: news-site

jobs:
  setup-scheduler:
    name: Configure Cloud Scheduler
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Require GCP_SA_KEY secret
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "${GCP_SA_KEY}" ]; then
            echo "::error::Repository secret GCP_SA_KEY is missing or empty."
            exit 1
          fi

      - name: Require GCP_PROJECT_ID secret
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if [ -z "${GCP_PROJECT_ID}" ]; then
            echo "::error::Repository secret GCP_PROJECT_ID is missing or empty."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve OIDC identity for Cloud Scheduler
        id: scheduler_oidc
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.GCP_SA_KEY }}' > .gha-sa-key.json
          KEY_PROJECT=$(jq -r .project_id .gha-sa-key.json)
          EMAIL=$(jq -r .client_email .gha-sa-key.json)
          rm -f .gha-sa-key.json
          if [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ] || [ "$KEY_PROJECT" = "null" ] || [ -z "$KEY_PROJECT" ]; then
            echo "::error::GCP_SA_KEY must be valid service account JSON with project_id and client_email."
            exit 1
          fi
          if [ "${GCP_PROJECT_ID}" != "${KEY_PROJECT}" ]; then
            echo "::error::GCP_PROJECT_ID secret (${GCP_PROJECT_ID}) does not match project_id inside GCP_SA_KEY (${KEY_PROJECT})."
            exit 1
          fi
          echo "email=${EMAIL}" >> "$GITHUB_OUTPUT"
          printf '%s' "$EMAIL" > .scheduler-oidc-email
          echo "Scheduler OIDC identity: ${EMAIL}"

      - name: Grant deploy SA Service Account User on itself (Scheduler OIDC actAs)
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          SA="$(cat .scheduler-oidc-email)"
          if gcloud iam service-accounts add-iam-policy-binding "$SA" \
            --project="${GCP_PROJECT_ID}" \
            --member="serviceAccount:${SA}" \
            --role="roles/iam.serviceAccountUser" \
            --quiet; then
            echo "Granted roles/iam.serviceAccountUser on ${SA}"
          else
            echo "::warning::Could not grant actAs self-binding. Owner: gcloud iam service-accounts add-iam-policy-binding ${SA} --project=${GCP_PROJECT_ID} --member=serviceAccount:${SA} --role=roles/iam.serviceAccountUser"
          fi

      - name: Grant Cloud Run invoker to scheduler OIDC identity
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          INVOKER_SA="$(cat .scheduler-oidc-email)"
          gcloud config set project "${GCP_PROJECT_ID}"
          if gcloud run services add-iam-policy-binding "${{ env.SERVICE_NAME }}" \
            --region="${{ env.REGION }}" \
            --member="serviceAccount:${INVOKER_SA}" \
            --role="roles/run.invoker" \
            --quiet; then
            echo "Granted roles/run.invoker on ${{ env.SERVICE_NAME }} to ${INVOKER_SA}"
          else
            echo "::warning::Could not set IAM on Cloud Run (need run.services.setIamPolicy). Run as Owner:"
            echo "::warning::gcloud run services add-iam-policy-binding ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --project=${GCP_PROJECT_ID} --member=serviceAccount:${INVOKER_SA} --role=roles/run.invoker"
          fi

      - name: Setup scheduler jobs
        env:
          SERVICE_URL: ${{ github.event.inputs.service_url }}
        run: |
          export SERVICE_ACCOUNT_EMAIL="$(cat .scheduler-oidc-email)"
          rm -f .scheduler-oidc-email
          chmod +x scripts/setup-cloud-scheduler.sh
          ./scripts/setup-cloud-scheduler.sh

      - name: List scheduler jobs
        run: |
          set -euo pipefail
          source scripts/lib/gcloud-list-formats.sh
          gcloud scheduler jobs list --location="${{ env.REGION }}" --format="${GCLOUD_SCHEDULER_JOBS_LIST_FORMAT}"

name: Setup Cloud Scheduler Jobs

on:
  workflow_dispatch:
    inputs:
      service_url:
        description: "Cloud Run HTTPS URL (must match --oidc-audience), e.g. https://news-site-xxxxx.asia-southeast1.run.app"
        required: true
        type: string

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-southeast1
  SERVICE_NAME: news-site

jobs:
  setup-scheduler:
    name: Configure Cloud Scheduler
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve OIDC identity for Cloud Scheduler
        id: scheduler_oidc
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.GCP_SA_KEY }}' > .gha-sa-key.json
          EMAIL=$(jq -r .client_email .gha-sa-key.json)
          rm -f .gha-sa-key.json
          if [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ]; then
            echo "::error::GCP_SA_KEY has no client_email"
            exit 1
          fi
          echo "email=${EMAIL}" >> "$GITHUB_OUTPUT"
          echo "Scheduler OIDC identity: ${EMAIL}"

      - name: Grant Cloud Run invoker to scheduler OIDC identity
        run: |
          gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"
          gcloud run services add-iam-policy-binding "${{ env.SERVICE_NAME }}" \
            --region="${{ env.REGION }}" \
            --member="serviceAccount:${{ steps.scheduler_oidc.outputs.email }}" \
            --role="roles/run.invoker" \
            --quiet

      - name: Setup scheduler jobs
        env:
          SERVICE_URL: ${{ github.event.inputs.service_url }}
          SERVICE_ACCOUNT_EMAIL: ${{ steps.scheduler_oidc.outputs.email }}
        run: |
          chmod +x scripts/setup-cloud-scheduler.sh
          ./scripts/setup-cloud-scheduler.sh

      - name: List scheduler jobs
        run: gcloud scheduler jobs list --location="${{ env.REGION }}" --format="table(name,schedule,state)"
